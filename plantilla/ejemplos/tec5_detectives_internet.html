<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detectives de internet: ¿real o falso? · Tecnología e Informática 5° · Semana 3</title>
<style>
:root{--mundo-primario:#4F46E5;--mundo-acento:#FFB800;--mundo-fondo:#0F0B3D;--ok:#22C55E;--casi:#F59E0B;--texto:#1b1448;--tarjeta:#fff;--contorno:#2B1B6B;--font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font-ui);color:var(--texto)}
body{background:radial-gradient(ellipse at 50% 0,#3a2a9a 0,var(--mundo-fondo) 70%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff6,transparent),radial-gradient(2px 2px at 120px 90px,#fff5,transparent);background-size:180px 140px;opacity:.5}
#app{position:relative;max-width:820px;margin:0 auto;padding:8px 12px 24px}
#barra{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#ffffff14;border:3px solid var(--contorno);border-radius:18px;padding:8px 12px;color:#fff;backdrop-filter:blur(4px)}
.hud-nota{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.hud-nota-label{font-size:.7rem;font-weight:900;letter-spacing:.08em;opacity:.8}
.hud-nota-valor{font-size:1.5rem;font-weight:900;color:#ffe27a;display:inline-block}.hud-nota-max,.hud-nota-aciertos,.hud-nota-sub{font-size:.75rem;opacity:.85}
.hud-nota-delta{font-size:.85rem;font-weight:900;color:#8cf0a0;opacity:0;pointer-events:none}
.hud-pulso{animation:hudPulso .6s ease}.delta-vis{animation:deltaUp 1.6s ease forwards}
@keyframes hudPulso{0%{transform:scale(1)}40%{transform:scale(1.35);color:#8cf0a0}100%{transform:scale(1)}}
@keyframes deltaUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#vidas-hud img,#xp-hud img{width:22px;height:22px;vertical-align:middle}#xp-hud{font-weight:800;font-size:.85rem}
#progreso{height:10px;margin:8px 4px;border-radius:99px;background:#ffffff22;overflow:hidden;border:2px solid var(--contorno)}#progreso i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5eeaff,#a855f7,#ffd23f);transition:width .4s}
#stage{background:var(--tarjeta);border:4px solid var(--contorno);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 8px 0 #1d1450;min-height:300px;outline:none}
#stage.fx-in{animation:fxIn .4s cubic-bezier(.2,.9,.3,1) both}@keyframes fxIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2{margin:.2em 0 .4em;line-height:1.15}h2{font-size:1.35rem}p,li{font-size:1.05rem;line-height:1.5}
.btn{font-family:inherit;font-weight:900;font-size:1rem;min-height:48px;padding:10px 18px;border-radius:16px;border:4px solid var(--contorno);cursor:pointer;color:#fff;background:linear-gradient(#6FA8FF,#2A5BE0);box-shadow:0 5px 0 #17338F;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #17338F}.btn:disabled,.btn[aria-disabled=true]{filter:grayscale(.7) brightness(.8);cursor:not-allowed}
.btn.verde{background:linear-gradient(#8CF0A0,#1FAF55);box-shadow:0 5px 0 #0F6A32}.btn.dorado{background:linear-gradient(#FFE97A,#F2A100);color:#4b2e00;box-shadow:0 5px 0 #8A5A00}
.opcion{display:block;width:100%;text-align:left;margin:8px 0;color:var(--texto);background:#f3f0ff;box-shadow:0 4px 0 #cfc7f7}
.opcion.ok{background:#d9f9e3;border-color:#1FAF55}.opcion.mal{background:#fff3df;border-color:#F59E0B}
#pie{position:sticky;bottom:0;padding:8px 0 4px}.nav{display:flex;gap:10px;justify-content:space-between}
.razon-bloqueo{font-size:.85rem;text-align:center;margin:6px 0;min-height:1.2em;color:#fff;opacity:.9}.razon-bloqueo.razon-ok{color:#8cf0a0;font-weight:900}
.rescate-wrap{text-align:center;margin:6px 0}.btn-rescate{min-height:44px;padding:10px 16px;border-radius:12px;border:3px solid var(--mundo-acento);background:#fff8dc;color:#4b2e00;font-family:inherit;font-weight:900;cursor:pointer}
.aviso-guardado{background:#fff0f0;border:3px solid #E01F4D;color:#8F1030;border-radius:12px;padding:10px 14px;margin:8px auto;max-width:520px;text-align:center;font-weight:800}
.tarjeta-reto{background:#f3f0ff;border:3px dashed var(--mundo-primario);border-radius:14px;padding:10px 14px;margin:8px 0}.tarjeta-reto p{margin:.25em 0;font-size:.98rem}
.fb-act{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.95rem}.fb-ok{background:#e8fff0;border:2px solid var(--ok)}.fb-mal{background:#fff8e1;border:2px solid var(--mundo-acento)}
.fb-item{background:#fff;border-left:4px solid var(--casi);border-radius:0 8px 8px 0;padding:6px 10px;margin:6px 0}.fb-item p{margin:.15em 0}
.chip,.zona{margin:4px;min-height:48px}.chip.sel{outline:4px solid var(--mundo-acento)}.chip.puesto{opacity:.55}
.zonas{display:flex;gap:8px;flex-wrap:wrap}.zona{flex:1;min-width:130px;background:#ece8ff;color:var(--texto);box-shadow:0 4px 0 #cfc7f7}
.zona .dentro{display:block;font-size:.85rem;margin-top:4px}
input[type=text]{font:inherit;font-size:1.05rem;padding:8px 10px;border:3px solid var(--contorno);border-radius:12px;min-width:140px}
.retro-bloque{text-align:left;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95rem}.retro-tu{background:#fff3df}.retro-buena{background:#e8fff0}.retro-porque{background:#eef2ff}.retro-como{background:#f3f0ff}.retro-nota{font-weight:900;margin:10px 0}
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}#modal[hidden]{display:none}
#modal-cuerpo{background:#fff;border:4px solid var(--contorno);border-radius:20px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1b1448;color:#fff;border:3px solid var(--mundo-acento);border-radius:99px;padding:8px 16px;font-weight:800;z-index:60;pointer-events:none;opacity:0;transition:opacity .25s}#toast.ver{opacity:1}
#fx-capa{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}.fx-chispa{position:absolute;width:10px;height:10px;border-radius:50%;animation:chispa .9s ease-out forwards}
@keyframes chispa{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.aria-esquina{position:fixed;right:8px;bottom:84px;width:150px;z-index:45;pointer-events:none;animation:fxIn .3s both}
#fx-intro{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:#fff;padding:20px;background:radial-gradient(ellipse at 50% 40%,#2a1470 0,#0b0630 60%,#030115 100%)}#fx-intro[hidden]{display:none}
#fx-intro h1{font-size:2rem;color:#ffe27a;text-shadow:0 4px 0 #2B1B6B}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.delta-vis{opacity:1}}
.img-apoyo{display:block;max-width:100%;max-height:230px;margin:10px auto;border-radius:12px;object-fit:contain}
</style>
</head>

/* ── almacenamiento (única puerta a localStorage) ── */
const memoria = {}; let usandoMemoria = false;
function almacen() {
  try { const ls = window.localStorage, k = '__t'; ls.setItem(k, '1'); ls.removeItem(k); usandoMemoria = false; return ls; }
  catch (e) { usandoMemoria = true; return { getItem: k => (k in memoria ? memoria[k] : null), setItem: (k, v) => { memoria[k] = String(v); }, removeItem: k => { delete memoria[k]; } }; }
}

/* ── estado ── */
function estadoEnCero() { return { slide: 0, seen: new Set(), acts: {}, aciertos: 0, intentos: 1, vidasUsadas: 0, mejorNota: 0, mejorAciertos: 0, mejorIntento: 1, historialIntentos: [], reintentoActivo: false, xp: 0, modoAdmin: false, name: NOMBRE }; }
let st = estadoEnCero();
const totalPreguntasReales = () => SL.filter(s => TIPOS_EVALUABLES.includes(s.type)).reduce((a, s) => a + (s.preguntas ? s.preguntas.length : 0), 0);
function recalcularAciertosDesdeContadores() { let n = 0; Object.keys(st.acts).forEach(k => { if (k.startsWith('quiz_resps_')) (st.acts[k] || []).forEach(r => { if (r.correcta) n++; }); }); st.aciertos = n; }
function calcTotal() { const t = totalPreguntasReales(); recalcularAciertosDesdeContadores(); return t ? Math.min(5, Math.max(0, (st.aciertos / t) * 5)) : 0; }
function actualizarMejorNota() { const a = calcTotal(); if (a > (st.mejorNota || 0) + 1e-9) { st.mejorNota = a; st.mejorAciertos = st.aciertos; st.mejorIntento = st.intentos; } }
function notaOficial() { return Math.max(calcTotal(), st.mejorNota || 0); }
function calcularSemaforoParticipacion() { const n = Object.keys(st.acts).filter(k => /_done_|completado_|ws_min_/.test(k)).length; return n >= 3 ? 'verde' : n >= 1 ? 'amarillo' : 'rojo'; }

const TIPOS_ACTIVIDAD = Object.keys(CLAVE_HECHO);
const T_RESCATE_S = (typeof window !== 'undefined' && window.__TEST__ && window.__TEST__.rescateS) || 25;   // a los 25 s aparece "🆘 No me sale" en TODA actividad no evaluable (en pruebas: window.__TEST__.rescateS)

// modo: 'acierto' | 'intento' | 'solucion' | 'rescate'. NUNCA toca nota, gemas ni XP. NUNCA se usa en quiz/evalFinal.
function marcarActividadHecha(sId, modo) {
  const s = SL.find(x => x.id === sId);
  if (!s || TIPOS_EVALUABLES.includes(s.type)) return false;
  const k = CLAVE_HECHO[s.type];
  if (!k) return false;
  if (!st.acts[k + sId]) {                         // idempotente: doble clic no repite nada
    st.acts[k + sId] = true;
    st.acts['modo_' + sId] = modo || 'intento';
    if (modo === 'rescate' || modo === 'solucion') st.acts['ayuda_' + sId] = true;   // dato para el Panel Docente
  }
  save();                                          // 8-B: en el mismo clic
  aplicarEstadoAvance(s);
  return true;
}

// Cierre universal de un "Verificar": SIEMPRE desbloquea, acierte o no. Devuelve qué mostrar.
// resultado: { aciertos, total, detalle:[{ ok, tuRespuesta, correcta, porQue }] }
function cerrarVerificacion(sId, resultado) {
  st.acts['intentos_' + sId] = (st.acts['intentos_' + sId] || 0) + 1;
  const total = resultado && resultado.total || 0;
  const perfecto = total > 0 && resultado.aciertos >= total;
  marcarActividadHecha(sId, perfecto ? 'acierto' : 'intento');
  return { perfecto, intento: st.acts['intentos_' + sId], mostrarSolucion: !perfecto };
}

// ═══ puedeAvanzar(s) — versión ÚNICA v23 (reemplaza la de 8-O: ahora cubre historia y minijuego) ═══
function puedeAvanzar(s) {
  if (!s) return true;
  if (st.modoAdmin) return true;
  if (st.reintentoActivo && !TIPOS_EVALUABLES.includes(s.type)) return true;
  switch (s.type) {
    case 'info': case 'repaso': case 'repaso2': case 'practica':
      return !!st.acts['leido_' + s.id];
    case 'quiz': case 'evalFinal':
      return st.acts['completado_' + s.id] === true;            // responder (bien o mal) basta
    case 'historia':
      return !!st.acts['historia_done_' + s.id] && (Date.now() - (st.acts['historia_t0_' + s.id] || 0) >= 10000);
    case 'minijuego':  return !!st.acts['mj_done_'     + s.id];
    case 'drag':       return !!st.acts['drag_done_'   + s.id];
    case 'match':      return !!st.acts['match_done_'  + s.id];
    case 'fill':       return !!st.acts['fill_done_'   + s.id];
    case 'tf':         return !!st.acts['tf_done_'     + s.id];
    case 'orden':      return !!st.acts['orden_done_'  + s.id];
    case 'wordsearch': return !!st.acts['ws_min_'      + s.id];
    case 'interactive':return !!st.acts['exp_min_'     + s.id];
    default: { const k = CLAVE_HECHO[s.type]; return k ? !!st.acts[k + s.id] : true; }   // tipos nuevos (v27) por tabla; intro y final libres
  }
}

// ═══ aplicarEstadoAvance(s) — versión v23: igual que 8-O + razón visible + rescate ═══
function aplicarEstadoAvance(s) {
  s = s || SL[st.slide];

  if (puedeAvanzar(s)) { detenerCronometroLectura(); habilitarBtnNext(); desactivarRescate(); pintarRazonBloqueo(s); return; }

  if (TIPOS_ACTIVIDAD.includes(s.type)) activarRescate(s);
  pintarRazonBloqueo(s);
}

// ═══ v25 · 52 — MOTOR CENTRAL DE EFECTOS «Juego»: todo evento del juego pasa por aquí (nunca efectos sueltos por el código) ═══
const Juego = (function () {
  const cfg = { sonido: true, movimiento: true, maxSimultaneos: 3 };
  let activos = 0, combo = 0, ej = {};                         // ej = ejecutores reales, inyectados por la clase
  // Tabla de efectos por evento. prio: 3 = nunca se descarta, 1 = se descarta si hay saturación.
  const TABLA = {
    acierto:    { prio: 1, sfx: 'acierto', burst: 'chico',  hud: 'pulso',                    aria: 'correcto',      ms: 900  },
    combo3:     { prio: 2, sfx: 'racha',   burst: 'medio',  hud: 'pulso', toast: '🔥 ¡Combo x3!', aria: 'genial',    ms: 1300 },
    combo5:     { prio: 2, sfx: 'racha',   burst: 'medio',  confeti: true, toast: '🔥 ¡Combo x5!', aria: 'genial',    ms: 1500 },
    casi:       { prio: 2, sfx: 'casi',                                                       aria: 'parece-dificil', ms: 700  },   // fallo: suave, SIN sacudida ni rojo
    pista:      { prio: 1, sfx: 'pista',                                                      ms: 400  },
    actividad:  { prio: 2, sfx: 'listo',   burst: 'chico',  toast: '✅ ¡Actividad completada!', aria: 'listo',      ms: 1000 },
    hito:       { prio: 3, sfx: 'hito',    burst: 'grande', confeti: true, aria: 'genial',      ms: 1800 },
    nivel:      { prio: 3, sfx: 'nivel',   burst: 'grande', confeti: true, aria: 'correcto', pantalla: 'nivel', ms: 2200 },
    desbloqueo: { prio: 2, sfx: 'cofre',   burst: 'medio',  ms: 1200 },
    jefe_golpe: { prio: 2, sfx: 'golpe',   burst: 'medio',  boss: 'golpe',                     ms: 800  },
    jefe_final: { prio: 3, sfx: 'nivel',   burst: 'grande', confeti: true, boss: 'derrota', aria: 'correcto', ms: 2500 }
  };
  function usar(ejecutores) { ej = ejecutores || {}; }
  function ajustar(o) { Object.assign(cfg, o || {}); }
  function correr(tipo, valor, e) {                           // un solo efecto; jamás lanza error ni bloquea
    try { if (typeof ej[tipo] === 'function') ej[tipo](valor, e); } catch (x) { /* un efecto roto no rompe la clase */ }
  }
  function evento(nombre, datos) {
    const fx = TABLA[nombre]; const lanzados = [];
    if (!fx) return lanzados;
    // combo silencioso: sube con cada acierto y se reinicia sin castigo visual
    if (nombre === 'acierto') { combo++; if (combo === 3) setTimeout0(() => evento('combo3')); if (combo === 5) setTimeout0(() => evento('combo5')); }
    if (nombre === 'casi') combo = 0;
    if (activos >= cfg.maxSimultaneos && fx.prio < 3) return lanzados;   // presupuesto: no saturar equipos lentos
    const visuales = ['burst', 'hud', 'confeti', 'boss', 'pantalla'];
    Object.keys(fx).forEach(k => {
      if (['prio', 'ms'].includes(k)) return;
      if (k === 'sfx' && !cfg.sonido) return;                  // sin sonido: todo mensaje importante sigue siendo texto
      if (visuales.includes(k) && !cfg.movimiento) return;     // «reducir movimiento»: sin partículas ni pulsos
      correr(k, fx[k], datos); lanzados.push(k);
    });
    activos++; setTimeout0(() => { activos = Math.max(0, activos - 1); }, fx.ms);
    return lanzados;
  }
  let setTimeout0 = (f, ms) => setTimeout(f, ms || 0);
  return { evento, usar, ajustar, _cfg: cfg, _tabla: TABLA, _reloj(f) { setTimeout0 = f; }, _estado: () => ({ activos, combo }) };
})();

// ═══ v31 · 69 — JUEGO «DETECTIVE»: encuentra las señales sospechosas en un correo, mensaje o sitio web ═══
// El estudiante toca las partes que parecen sospechosas (🚩) y pulsa «Revisar». Cada revisión dice cuántas pistas
// encontró y cuántas señales eran falsas alarmas, SIN decir cuáles. 1.ª revisión perfecta = 1 punto · 2.ª = 0,5 ·
// si no lo logra en 2 revisiones se muestran todas las pistas con su explicación (0). No toca la nota ni retiene a nadie.

CLAVE_HECHO.detective = 'det_done_';
if (!TIPOS_ACTIVIDAD.includes('detective')) TIPOS_ACTIVIDAD.push('detective');

(function () {
  const c = document.createElement('style');
  c.textContent = '.v31-msg{border:2px solid #94a3b8;border-radius:14px;background:#fff;color:#1f2937;padding:10px 12px;margin:10px 0}.v31-msg .ctx{font-weight:800;color:#475569;margin-bottom:6px}' +

  document.head.appendChild(c);

const v31G = s => { const k = 'v31_' + s.id; if (!st.acts[k]) st.acts[k] = { sel: [], rev: 0, r: null, h: 0 }; return st.acts[k]; };
const v31Claves = (s, soloPistas) => { const o = []; s.lineas.forEach((l, i) => l.forEach((p, j) => { if (!p.fijo && (!soloPistas || p.s)) o.push(i + ',' + j); })); return o; };

function rDetective(s) {
  const g = v31G(s), pistas = v31Claves(s, true), fin = g.r !== null, enc = g.sel.filter(k => pistas.includes(k)).length;
  const fb = fin ? (g.r === 1 ? '🕵️ ¡Detective de primera! Encontraste todas las pistas sin falsas alarmas.' : g.r === 0.5 ? '🕵️ ¡Lo lograste en la 2.ª revisión!' : '💡 Aquí tienes todas las pistas. ¡La próxima las encuentras!') : (g.rev === 1 ? '🔁 Encontraste ' + g.ult[0] + ' de ' + pistas.length + ' pistas' + (g.ult[1] ? ' y ' + g.ult[1] + ' señal(es) que en realidad estaban bien' : '') + '. Prueba otra vez (te queda 1 revisión).' : '');
  return '<h2>' + esc(s.titulo) + '</h2>' + (s.intro ? '<p>' + esc(s.intro) + '</p>' : '') +
    tarjeta('Encuentra las ' + pistas.length + ' señales sospechosas.', 'Toca las partes que te parezcan sospechosas 🚩 y pulsa «Revisar» (tienes 2 revisiones y un botón 💡 Pista).', 'Revisa (acierte o no) o pulsa «No me sale».', fin ? 'terminado' : g.sel.length + ' marcadas') +
    '<div class="v31-msg" data-test="det-msg"><div class="ctx">' + esc(s.contexto || 'Mensaje') + '</div>' + s.lineas.map((l, i) => '<div class="v31-lin">' + l.map((p, j) => {
      if (p.fijo) return '<span class="v31-fijo">' + esc(p.t) + '</span>';
      const k = i + ',' + j, m = g.sel.includes(k); let cl = m ? 'sel' : '';
      if (fin) cl = p.s ? (m ? 'ok' : 'miss') : (m ? 'falsa' : '');
      return '<button type="button" class="v31-seg ' + cl + '" data-test="det-seg" data-accion="v31-seg" data-k="' + k + '" data-s="' + (p.s ? 1 : 0) + '" aria-pressed="' + m + '"' + (fin ? ' disabled' : '') + '>' + esc(p.t) + '</button>'; }).join('') + '</div>').join('') + '</div>' +
    (fin ? '<div class="v31-por" data-test="det-porque"><strong>🔎 Las pistas eran:</strong><ul>' + s.lineas.flat().filter(p => p.s).map(p => '<li><strong>' + esc(p.t) + '</strong>: ' + esc(p.porQue) + '</li>').join('') + '</ul></div>' :
      '<button type="button" class="btn dorado" data-test="det-revisar" data-accion="v31-revisar">🔎 Revisar</button> <button type="button" class="btn" data-test="det-pista" data-accion="v31-pista">💡 Pista</button>' + (g.h ? '<p data-test="det-pista-txt">💡 ' + esc(s.pista || 'Mira con calma el remitente, el asunto, los enlaces y si te meten prisa o piden datos.') + '</p>' : '')) +
    '<p data-test="det-fb">' + fb + '</p>';
}

$('stage').addEventListener('click', e => {
  const b = e.target.closest('[data-accion^="v31-"]'); if (!b || b.disabled) return; const s = SL[st.slide], g = v31G(s), a = b.dataset.accion; if (g.r !== null) return;
  if (a === 'v31-seg') { const k = b.dataset.k, i = g.sel.indexOf(k); i < 0 ? g.sel.push(k) : g.sel.splice(i, 1); save(); return render(false); }
  if (a === 'v31-pista') { g.h = 1; save(); return render(false); }
  if (a === 'v31-revisar') {
    const pistas = v31Claves(s, true), enc = g.sel.filter(k => pistas.includes(k)).length, fal = g.sel.length - enc;

    if (d.sel === null) { showToast('👆 Primero toca una ficha'); return; }
    const i = d.sel, c = s.chips[i], z = b.dataset.z;
    if (c.z === z) { d.puestos[i] = z; d.sel = null; st.acts['drag_fb_' + s.id] = '<div class="fb-act fb-ok">✅ ¡Eso! ' + esc(c.porQue) + '</div>'; Juego.evento('acierto'); }
    else { d.errores[i] = (d.errores[i] || 0) + 1; if (d.errores[i] >= 2) { d.puestos[i] = c.z; d.sel = null; st.acts['drag_fb_' + s.id] = '<div class="fb-act fb-mal">💡 Va aquí: ' + esc(c.porQue) + '</div>'; } else st.acts['drag_fb_' + s.id] = '<div class="fb-act fb-mal">💡 Casi. Pista: piensa en dónde está respecto de la coma.</div>'; Juego.evento('casi'); }
    if (Object.keys(d.puestos).length >= 2) { const todas = Object.keys(d.puestos).length >= s.chips.length; marcarActividadHecha(s.id, todas ? 'acierto' : 'intento'); if (todas) { sumarXP(10); Juego.evento('actividad'); } }
    save(); return render(false); }
  if (a === 'mj-op') { const m = st.acts['mj_' + s.id] = st.acts['mj_' + s.id] || { r: 0, ac: 0, resp: null }; if (m.resp !== null) return; const i = +b.dataset.i, R = s.rondas[m.r], ok = i === R.ok;
    m.resp = i; if (ok) m.ac++; Juego.evento(ok ? 'acierto' : 'casi'); sumarXP(ok ? 8 : 3); save(); render(false);
    tMj = setTimeout(() => { tMj = null; m.r++; m.resp = null; if (m.r >= s.rondas.length) { finalizarMinijuego(s.id, { estrellas: m.ac }); sumarXP(10); Juego.evento('actividad'); } save(); render(false); }, 1100 * FACTOR); return; }
  if (a === 'reintentar') { showModal('<h2>¿Practicar de nuevo?</h2><p>Usarás <strong>1 oportunidad de práctica</strong>. Solo se repiten los quizzes y <strong>tu mejor nota se queda segura</strong>.</p><button type="button" class="btn verde" data-test="confirmar-reintento" data-accion="confirmar-reintento">Sí, ¡vamos!</button> <button type="button" class="btn" data-test="cancelar" onclick="closeModal()">Ahora no</button>'); return; }
});
$('modal').addEventListener('click', e => { const b = e.target.closest('[data-accion="confirmar-reintento"]'); if (b) iniciarNuevoIntento(); });
$('btn-next').addEventListener('click', () => { const s = SL[st.slide]; if (!puedeAvanzar(s)) { pintarRazonBloqueo(s); showToast(razonBloqueo(s)); return; } irA(siguienteIndice()); });
$('btn-prev').addEventListener('click', () => { if (st.slide > 0) irA(st.slide - 1); });
$('btn-empezar').addEventListener('click', () => { $('fx-intro').hidden = true; crearAudio(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
window.addEventListener('beforeunload', save); document.addEventListener('visibilitychange', () => { if (document.hidden) save(); }); window.addEventListener('pagehide', save);
setInterval(save, 20000);

/* ── API para pruebas (59) ── */
window.CLASE_API = { MOTOR_VERSION, SL, ERRORES, claseId: CLASE_ID, semana: CONFIG_CLASE.semana, SKEY, IKEY, Juego, GENERADORES, GENERAR: (g, seed) => GENERADORES[g](rngDe(seed), { id: 'x', dba: 'x', nivel: 'x' }),
  estado: () => JSON.parse(JSON.stringify({ slide: st.slide, aciertos: st.aciertos, intentos: st.intentos, vidasUsadas: st.vidasUsadas, mejorNota: st.mejorNota, reintentoActivo: st.reintentoActivo, xp: st.xp, total: TOT, tipo: SL[st.slide].type, acts: st.acts })),
  notaHud: () => $('nota-hud').textContent, notaOficial, calcTotal, razonBloqueo: () => razonBloqueo(SL[st.slide]), rescate: () => usarRescate(SL[st.slide].id), puedeAvanzar: () => puedeAvanzar(SL[st.slide]),
  actividadesConAyuda: () => Object.keys(st.acts).filter(k => k.startsWith('ayuda_')).length, irA,
  opcionCorrectaActual: () => { const s = SL[st.slide]; if (!TIPOS_EVALUABLES.includes(s.type)) return null; const idx = st.acts['quiz_idx_' + s.id] || 0; if (idx >= s.preguntas.length) return null; const o = vistaPregunta(s, idx).preg.opciones.find(x => x.correcta); return { id: o.id, texto: o.texto }; } };

/* ── arranque ── */
const habiaSesion = load(); render(true);
if (TEST && TEST.sinIntro) $('fx-intro').hidden = true;
})();
</script>
